<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Novel Reader (On-Demand Performance Edition)</title>
    <style>
        :root {
            --bg-color: #f6f1e9;
            --text-color: #2c251e;
            --sidebar-bg: #eddcc9;
            --sidebar-hover: #dfcaa7;
            --accent-color: #8b5a2b;
            --font-size: 19px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Dropzone Overlay --- */
        #upload-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .drop-zone {
            width: 80%;
            max-width: 500px;
            padding: 40px;
            border: 3px dashed var(--accent-color);
            border-radius: 10px;
            text-align: center;
            background: var(--sidebar-bg);
            cursor: pointer;
        }

        /* --- Sidebar Navigation --- */
        #sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
        }
        .nav-button-row {
            display: flex;
            gap: 8px;
        }
        .quick-nav-btn {
            flex: 1;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .quick-nav-btn:hover { opacity: 0.9; }
        
        #chapter-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        #chapter-list li {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #chapter-list li:hover { background-color: var(--sidebar-hover); }
        #chapter-list li.active {
            background-color: var(--accent-color);
            color: white;
        }

        /* --- Main Content Area --- */
        #main-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 40px;
            display: flex;
            justify-content: center;
        }
        #reader-container {
            width: 100%;
            max-width: 800px;
            padding: 40px 0 80px 0;
        }

        /* --- Typography Styles --- */
        .chapter-header {
            border-bottom: 2px dashed rgba(0,0,0,0.1);
            margin-bottom: 30px;
            padding-bottom: 15px;
        }
        .chapter-title-heading {
            font-size: 28px;
            font-weight: bold;
            margin: 0 0 10px 0;
            color: var(--accent-color);
        }
        .meta-tag {
            font-size: 12px;
            color: #7f8c8d;
            font-style: italic;
        }
        .reader-p {
            font-size: var(--font-size);
            line-height: 1.8;
            margin-bottom: 1.5em;
            text-align: justify;
            text-indent: 2em;
        }

        /* --- Bottom Page Controls --- */
        .page-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="upload-container">
        <div class="drop-zone" id="drop-zone">
            <h3>🗂️ Drop your Pro Novel JSON here</h3>
            <p>or click to browse local files</p>
            <input type="file" id="file-input" accept=".json" style="display: none;">
        </div>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">📖 目錄 (Index)</div>
            <div class="nav-button-row">
                <button class="quick-nav-btn" id="btn-jump-first">⏮️ First</button>
                <button class="quick-nav-btn" id="btn-jump-last">⏭️ Last</button>
            </div>
        </div>
        <ul id="chapter-list"></ul>
    </div>

    <div id="main-content">
        <div id="reader-container">
            </div>
    </div>

    <script>
        let novelData = {};
        let sortedChapters = [];
        let currentActiveIndex = 0; // Tracks position in sortedChapters array

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const uploadContainer = document.getElementById('upload-container');
        const chapterListEl = document.getElementById('chapter-list');
        const readerContainer = document.getElementById('reader-container');
        const mainContent = document.getElementById('main-content');
        
        const btnJumpFirst = document.getElementById('btn-jump-first');
        const btnJumpLast = document.getElementById('btn-jump-last');

        // File loading event mechanics
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.opacity = 0.7; });
        dropZone.addEventListener('dragleave', () => dropZone.style.opacity = 1);
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            if(e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });

        function handleFileSelect() {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    novelData = JSON.parse(e.target.result);
                    processNovelIndices();
                    uploadContainer.style.display = 'none';
                } catch (err) {
                    alert("Error parsing JSON file. Make sure it's valid Pro format.");
                }
            };
            reader.readAsText(file);
        }

        // Pre-process and build the sidebar index framework
        function processNovelIndices() {
            sortedChapters = Object.keys(novelData).sort((a, b) => parseInt(a) - parseInt(b));
            chapterListEl.innerHTML = '';

            sortedChapters.forEach((chapNum, index) => {
                const chap = novelData[chapNum];
                
                // Title Strategy: Meta Title -> Scrape From Text Fallback -> Default Placeholder
                let computedTitle = chap.metadata?.title || fallbackRecoverTitle(chap.pages || chap);

                const li = document.createElement('li');
                li.textContent = computedTitle;
                li.id = `sidebar-item-${index}`;
                li.addEventListener('click', () => renderChapter(index));
                chapterListEl.appendChild(li);
            });

            // Auto-load the very first chapter on boot safely
            if (sortedChapters.length > 0) {
                renderChapter(0);
            }

            // Bind Quick Jump Actions
            btnJumpFirst.addEventListener('click', () => renderChapter(0));
            btnJumpLast.addEventListener('click', () => renderChapter(sortedChapters.length - 1));
        }

        // On-Demand Renderer Engine: Destroys previous view nodes and loads precisely one chapter
        function renderChapter(index) {
            if (index < 0 || index >= sortedChapters.length) return;
            currentActiveIndex = index;
            
            const chapNum = sortedChapters[index];
            const chapData = novelData[chapNum];
            const pagesObj = chapData.pages || chapData; // Handle fallback structural objects safely
            
            readerContainer.innerHTML = ''; // Wipe DOM completely to free memory heap

            // 1. Gather and stitch page tokens cleanly
            const sortedPageKeys = Object.keys(pagesObj).sort((a, b) => parseInt(a) - parseInt(b));
            let allParagraphs = [];
            sortedPageKeys.forEach(pKey => {
                if (Array.isArray(pagesObj[pKey])) {
                    allParagraphs = allParagraphs.concat(pagesObj[pKey]);
                }
            });

            // 2. Resolve final presentation elements
            let titleText = chapData.metadata?.title || fallbackRecoverTitle(pagesObj);
            let timeText = chapData.metadata?.lastUpdated || "Unknown Date";

            // 3. Build Node Layout Fragments
            const headerDiv = document.createElement('div');
            headerDiv.className = 'chapter-header';
            headerDiv.innerHTML = `
                <h1 class="chapter-title-heading">${titleText}</h1>
                <span class="meta-tag">Crawled on: ${timeText}</span>
            `;
            readerContainer.appendChild(headerDiv);

            // Append paragraphs sequentially
            allParagraphs.forEach(text => {
                if (text === titleText) return; // Prevent duplicating header text if present in body
                const p = document.createElement('p');
                p.className = 'reader-p';
                p.textContent = text;
                readerContainer.appendChild(p);
            });

            // 4. Append operational bottom pagination row dynamically
            const controlDiv = document.createElement('div');
            controlDiv.className = 'page-controls';
            
            const prevBtn = document.createElement('button');
            prevBtn.className = 'quick-nav-btn';
            prevBtn.textContent = '👈 Previous Chapter';
            prevBtn.disabled = (index === 0);
            prevBtn.onclick = () => renderChapter(index - 1);

            const nextBtn = document.createElement('button');
            nextBtn.className = 'quick-nav-btn';
            nextBtn.textContent = 'Next Chapter 👉';
            nextBtn.disabled = (index === sortedChapters.length - 1);
            nextBtn.onclick = () => renderChapter(index + 1);

            controlDiv.appendChild(prevBtn);
            controlDiv.appendChild(nextBtn);
            readerContainer.appendChild(controlDiv);

            // 5. Interface Synchronization Updates
            highlightSidebarItem(index);
            mainContent.scrollTop = 0; // Instantly bounce reader gaze frame to top of fresh chapter block
        }

        function highlightSidebarItem(index) {
            document.querySelectorAll('#chapter-list li').forEach(li => li.classList.remove('active'));
            const activeLi = document.getElementById(`sidebar-item-${index}`);
            if (activeLi) {
                activeLi.classList.add('active');
                activeLi.scrollIntoView({ block: 'nearest' });
            }
        }

        function fallbackRecoverTitle(pages) {
            for (let p in pages) {
                if (Array.isArray(pages[p])) {
                    let found = pages[p].find(t => t.includes('第') && t.includes('章'));
                    if (found) return found;
                }
            }
            return "Untitled Chapter Block";
        }
    </script>
</body>
</html>
